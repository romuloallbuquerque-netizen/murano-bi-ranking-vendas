<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel em manutenção · Murano Professional</title>
<style>
  :root {
    --murano-dark:   #1c0e1b;
    --murano-wine:   #621244;
    --murano-orange: #dd4222;
    --murano-blush:  #e4d4d3;
    --murano-muted:  #9a8098;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: var(--murano-blush);
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(155deg, #1c0e1b 0%, #0d0512 100%);
    display: flex; align-items: center; justify-content: center;
  }
  .stripe {
    position: fixed; left: 0; top: 0; bottom: 0; width: 5px;
    background: linear-gradient(to bottom, var(--murano-orange), var(--murano-wine), #7b2d8b);
  }
  .orb {
    position: fixed; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, rgba(98,18,68,0.55) 0%, transparent 65%);
    width: 46vh; height: 46vh; top: -16vh; right: -10vh;
  }
  .box { text-align: center; padding: 2rem; max-width: 40rem; position: relative; z-index: 2; }
  h1 {
    font-weight: 800;
    font-size: clamp(1.6rem, 4.5vh, 3rem);
    color: #fff;
    letter-spacing: -0.02em;
    margin-bottom: 1.2rem;
  }
  p { color: var(--murano-muted); font-size: clamp(0.9rem, 2.2vh, 1.3rem); line-height: 1.6; }
  .brand {
    margin-top: 2.4rem;
    font-size: clamp(0.65rem, 1.6vh, 0.95rem);
    letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;
    color: var(--murano-blush);
  }
</style>
</head>
<body>
<div class="stripe"></div>
<div class="orb"></div>
<div class="box">
  <h1>Painel temporariamente em manutenção</h1>
  <p>O ranking de vendas está passando por ajustes e voltará em breve.<br>Esta tela se atualizará sozinha quando o painel retornar.</p>
  <div class="brand">Murano Professional</div>
</div>
<script>
(function () {
  // Mantem o mecanismo de auto-atualizacao: quando o painel voltar ao ar,
  // as TVs que estiverem nesta tela recarregam sozinhas.
  var htmlBase = null;
  function checkVersion() {
    fetch(location.href.split('#')[0], { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(function (txt) {
        if (htmlBase === null) { htmlBase = txt; return; }
        if (txt !== htmlBase) location.reload();
      })
      .catch(function () {});
  }
  checkVersion();
  setInterval(checkVersion, 60000);
  setTimeout(function () { location.reload(); }, 24 * 60 * 60 * 1000);
})();
</script>
</body>
</html>
